<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Strength">
<title>Strength Tracker</title>
<style>
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;background:#101318;color:#fff}
.header{padding:16px;background:#171b22;border-bottom:1px solid #303845;position:sticky;top:0;z-index:10}
.header h1{font-size:20px;margin:0}
.sub{font-size:12px;color:#aab2bd;margin-top:4px}
.wrap{padding:12px;max-width:520px;margin:0 auto}
.card{background:#171b22;border:1px solid #303845;border-radius:12px;padding:14px;margin-bottom:12px}
button,select,input,textarea{font-family:inherit;font-size:16px}
button{background:#222935;color:#fff;border:1px solid #394352;border-radius:10px;padding:12px 14px;min-height:44px}
button.primary{background:#67b7ff;color:#091018;border:none;font-weight:bold}
button.good{background:#53d18b;color:#07120c;border:none;font-weight:bold}
button.warn{background:#ffc85a;color:#211700;border:none}
button.bad{background:#ff6d6d;color:#220808;border:none}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.tabs{display:flex;gap:8px;margin-bottom:12px}
.tabs button{flex:1}
.tabs .active{outline:2px solid #67b7ff}
select,input{background:#0f1319;color:#fff;border:1px solid #394352;border-radius:8px;padding:10px}
select{width:100%}
.exercise{padding-top:12px;margin-top:12px;border-top:1px solid #303845}
.exercise:first-child{border-top:none;margin-top:0;padding-top:0}
.exercise h3{font-size:17px;margin:0 0 4px}
.meta{font-size:12px;color:#aab2bd;margin-bottom:8px}
.warm{background:#0f1319;border-radius:8px;padding:8px;margin:5px 0;color:#c7ccd3;font-size:13px}
.set{display:flex;gap:8px;align-items:center;background:#222935;border:1px solid #394352;border-radius:9px;padding:8px;margin:7px 0}
.set.done{border-color:#53d18b}
.set .label{width:58px;font-size:13px;color:#aab2bd}
.set input{width:70px}
.set button{margin-left:auto;padding:9px 11px;min-height:38px}
.small{font-size:12px;color:#aab2bd}
.timer{font-size:28px;font-weight:bold;font-variant-numeric:tabular-nums}
textarea{width:100%;min-height:70px;background:#0f1319;color:#fff;border:1px solid #394352;border-radius:8px;padding:9px}
.hidden{display:none}
.historyItem{padding:10px 0;border-bottom:1px solid #303845}
.footer{font-size:11px;color:#7f8896;padding:16px 2px 28px}
</style>
</head>
<body>
<div class="header">
  <h1>Strength & Conditioning</h1>
  <div class="sub">Mobile-first tracker for iPhone 6</div>
</div>

<div class="wrap">
  <div class="tabs">
    <button id="tabWorkout" class="active" onclick="showTab('workout')">Workout</button>
    <button id="tabHistory" onclick="showTab('history')">History</button>
    <button id="tabSetup" onclick="showTab('setup')">Setup</button>
  </div>

  <div id="workoutPane">
    <div class="card">
      <div class="small">Training day</div>
      <select id="daySelect" onchange="renderWorkout()"></select>
      <div style="height:12px"></div>
      <div class="row spread">
        <div>
          <div class="small">Rest timer</div>
          <div id="timer" class="timer">00:00</div>
        </div>
        <div class="row">
          <button onclick="startTimer(90)">90s</button>
          <button onclick="startTimer(180)">3m</button>
          <button onclick="stopTimer()">Stop</button>
        </div>
      </div>
    </div>
    <div id="workout"></div>
  </div>

  <div id="historyPane" class="hidden">
    <div class="card">
      <div class="row spread">
        <h2 style="margin:0;font-size:18px">Workout History</h2>
        <button class="bad" onclick="clearHistory()">Clear</button>
      </div>
      <div id="history"></div>
    </div>
  </div>

  <div id="setupPane" class="hidden">
    <div class="card">
      <h2 style="margin-top:0;font-size:18px">Starting Weights</h2>
      <div id="setupFields"></div>
      <button class="primary" style="width:100%;margin-top:10px" onclick="saveSetup()">Save starting weights</button>
    </div>
  </div>

  <div class="footer">Data is stored locally on this device. This MVP is intentionally simple and compatible with older iPhone Safari.</div>
</div>

<script>
var program = [
 {name:"Monday - Legs & Shoulders", exercises:[
  {name:"Back Squat",type:"5x5",sets:5,reps:5,inc:5,warm:true},
  {name:"Overhead Press",type:"5x5",sets:5,reps:5,inc:5,warm:true},
  {name:"Romanian Deadlift",type:"range",sets:3,min:6,max:8,inc:5,warm:false},
  {name:"Leg Curl",type:"range",sets:3,min:8,max:12,inc:5,warm:false},
  {name:"Lateral Raise",type:"range",sets:3,min:10,max:15,inc:5,warm:false},
  {name:"Calf Raise",type:"range",sets:3,min:10,max:15,inc:5,warm:false},
  {name:"Front Plank",type:"time",sets:3,seconds:30,inc:5,warm:false},
  {name:"Pallof Press",type:"range",sets:3,min:8,max:12,inc:5,warm:false}
 ]},
 {name:"Tuesday - Chest & Triceps", exercises:[
  {name:"Bench Press",type:"5x5",sets:5,reps:5,inc:5,warm:true},
  {name:"Incline Dumbbell Press",type:"range",sets:3,min:6,max:10,inc:5,warm:false},
  {name:"Chest Fly / Pec Deck",type:"range",sets:3,min:10,max:15,inc:5,warm:false},
  {name:"Seated Dip Machine",type:"range",sets:3,min:8,max:12,inc:5,warm:false},
  {name:"Overhead Triceps Extension",type:"range",sets:3,min:10,max:15,inc:5,warm:false},
  {name:"Zone 2 Cardio",type:"time",sets:1,seconds:1800,inc:300,warm:false}
 ]},
 {name:"Wednesday - Conditioning & Mobility", exercises:[
  {name:"Row / Ruck / Swim",type:"time",sets:1,seconds:1800,inc:300,warm:false},
  {name:"Mobility / Pilates",type:"time",sets:1,seconds:900,inc:300,warm:false},
  {name:"Grip Training",type:"range",sets:3,min:10,max:15,inc:5,warm:false}
 ]},
 {name:"Thursday - Back & Biceps", exercises:[
  {name:"Barbell Row",type:"5x5",sets:5,reps:5,inc:5,warm:true},
  {name:"Deadlift",type:"fixed",sets:1,reps:5,inc:5,warm:true},
  {name:"Lat Pulldown / Pull-up",type:"range",sets:3,min:6,max:10,inc:5,warm:false},
  {name:"Chest-Supported Row Machine",type:"range",sets:3,min:8,max:12,inc:5,warm:false},
  {name:"Face Pull",type:"range",sets:3,min:12,max:15,inc:5,warm:false},
  {name:"EZ-Bar Curl",type:"range",sets:3,min:8,max:12,inc:5,warm:false},
  {name:"Hammer Curl",type:"range",sets:2,min:10,max:15,inc:5,warm:false},
  {name:"Ab Wheel Rollout",type:"range",sets:3,min:6,max:10,inc:1,warm:false},
  {name:"Side Plank",type:"time",sets:2,seconds:30,inc:5,warm:false}
 ]},
 {name:"Friday - Functional / Athletic", exercises:[
  {name:"Farmer Carry",type:"time",sets:3,seconds:40,inc:5,warm:false},
  {name:"Sandbag Carry",type:"time",sets:3,seconds:40,inc:5,warm:false},
  {name:"Kettlebell Swing",type:"range",sets:3,min:10,max:15,inc:5,warm:false},
  {name:"Step-ups",type:"range",sets:3,min:8,max:12,inc:5,warm:false},
  {name:"Intervals",type:"time",sets:6,seconds:30,inc:0,warm:false}
 ]}
];

var timerId=null, timerLeft=0;

function key(s){return "st_"+s.replace(/[^A-Za-z0-9]/g,"_");}
function getWeight(name){var v=localStorage.getItem(key(name)); return v===null?45:parseFloat(v);}
function setWeight(name,v){localStorage.setItem(key(name),String(v));}
function round5(x){return Math.max(5,Math.round(x/5)*5);}

function warmups(weight){
 var a=[];
 if(weight<=55){a.push("Bar x 5","Bar x 5"); return a;}
 a.push("Bar x 5","Bar x 5");
 var w1=round5(weight*.5), w2=round5(weight*.7), w3=round5(weight*.85);
 if(w1>45)a.push(w1+" lb x 5");
 if(w2>w1)a.push(w2+" lb x 3");
 if(w3>w2)a.push(w3+" lb x 2");
 return a;
}

function init(){
 var ds=document.getElementById("daySelect"), i, opt;
 for(i=0;i<program.length;i++){
  opt=document.createElement("option"); opt.value=i; opt.text=program[i].name; ds.appendChild(opt);
 }
 renderSetup(); renderWorkout(); renderHistory();
}

function showTab(t){
 document.getElementById("workoutPane").className=t==="workout"?"":"hidden";
 document.getElementById("historyPane").className=t==="history"?"":"hidden";
 document.getElementById("setupPane").className=t==="setup"?"":"hidden";
 document.getElementById("tabWorkout").className=t==="workout"?"active":"";
 document.getElementById("tabHistory").className=t==="history"?"active":"";
 document.getElementById("tabSetup").className=t==="setup"?"active":"";
 if(t==="history")renderHistory();
}

function renderWorkout(){
 var day=program[parseInt(document.getElementById("daySelect").value||0,10)];
 var box=document.getElementById("workout"), html='<div class="card"><h2 style="font-size:19px;margin-top:0">'+day.name+'</h2>';
 var i,j,e,w;
 for(i=0;i<day.exercises.length;i++){
  e=day.exercises[i]; w=getWeight(e.name);
  html+='<div class="exercise"><h3>'+e.name+'</h3>';
  if(e.type==="5x5"||e.type==="fixed"||e.type==="range"){
    html+='<div class="meta">Working weight: <b>'+w+' lb</b>';
    if(e.type==="5x5") html+=' • 5 x 5';
    if(e.type==="fixed") html+=' • '+e.sets+' x '+e.reps;
    if(e.type==="range") html+=' • '+e.sets+' x '+e.min+'-'+e.max;
    html+='</div>';
  } else {
    html+='<div class="meta">'+e.sets+' set(s) • time target</div>';
  }
  if(e.warm){
   var wu=warmups(w);
   html+='<div class="small">Warm-up</div>';
   for(j=0;j<wu.length;j++) html+='<div class="warm">'+wu[j]+'</div>';
  }
  for(j=1;j<=e.sets;j++){
    var defaultRep=e.type==="time"?e.seconds:(e.type==="range"?e.min:e.reps);
    var unit=e.type==="time"?"sec":"reps";
    html+='<div class="set" id="set_'+i+'_'+j+'"><span class="label">Set '+j+'</span>'+
          '<input id="rep_'+i+'_'+j+'" type="number" value="'+defaultRep+'" min="0">'+
          '<span class="small">'+unit+'</span>'+
          '<button onclick="doneSet('+i+','+j+')">Done</button></div>';
  }
  html+='</div>';
 }
 html+='<div class="exercise"><div class="small">Workout notes</div><textarea id="notes" placeholder="Energy, soreness, technique notes..."></textarea>'+
       '<button class="good" style="width:100%;margin-top:10px" onclick="completeWorkout()">Complete workout</button></div>';
 html+='</div>';
 box.innerHTML=html;
}

function doneSet(i,j){
 var el=document.getElementById("set_"+i+"_"+j);
 if(el.className.indexOf("done")<0) el.className+=" done"; else el.className="set";
 startTimer(90);
}

function completeWorkout(){
 var dayIndex=parseInt(document.getElementById("daySelect").value||0,10);
 var day=program[dayIndex], i,j,e,success=true, details=[];
 for(i=0;i<day.exercises.length;i++){
   e=day.exercises[i]; var vals=[], exSuccess=true;
   for(j=1;j<=e.sets;j++){
     var v=parseInt(document.getElementById("rep_"+i+"_"+j).value||0,10); vals.push(v);
     if(e.type==="5x5"||e.type==="fixed"){ if(v<e.reps) exSuccess=false; }
     if(e.type==="range"){ if(v<e.max) exSuccess=false; }
     if(e.type==="time"){ if(v<e.seconds) exSuccess=false; }
   }
   if((e.type==="5x5"||e.type==="fixed") && exSuccess) setWeight(e.name,getWeight(e.name)+e.inc);
   if(e.type==="range" && exSuccess) setWeight(e.name,getWeight(e.name)+e.inc);
   details.push({name:e.name,values:vals,success:exSuccess,weight:getWeight(e.name)});
   if(!exSuccess) success=false;
 }
 var hist=JSON.parse(localStorage.getItem("st_history")||"[]");
 hist.unshift({date:new Date().toLocaleString(),day:day.name,success:success,notes:document.getElementById("notes").value,details:details});
 if(hist.length>100)hist=hist.slice(0,100);
 localStorage.setItem("st_history",JSON.stringify(hist));
 alert("Workout saved. Successful main lifts have progressed automatically.");
 renderWorkout();
}

function renderHistory(){
 var hist=JSON.parse(localStorage.getItem("st_history")||"[]"), h="";
 if(!hist.length){h='<p class="small">No workouts saved yet.</p>';}
 else{
  for(var i=0;i<hist.length;i++){
   h+='<div class="historyItem"><b>'+hist[i].day+'</b><div class="small">'+hist[i].date+'</div>'+
      '<div class="small">'+(hist[i].success?'Completed target':'Some targets missed')+'</div>'+
      (hist[i].notes?'<div style="margin-top:5px">'+hist[i].notes+'</div>':'')+'</div>';
  }
 }
 document.getElementById("history").innerHTML=h;
}

function clearHistory(){
 if(confirm("Clear all saved workout history?")){localStorage.removeItem("st_history");renderHistory();}
}

function renderSetup(){
 var seen={}, html="", i,j,e;
 for(i=0;i<program.length;i++){
  for(j=0;j<program[i].exercises.length;j++){
   e=program[i].exercises[j];
   if((e.type==="5x5"||e.type==="fixed"||e.type==="range")&&!seen[e.name]){
    seen[e.name]=1;
    html+='<div style="margin-bottom:10px"><div class="small">'+e.name+'</div>'+
          '<input style="width:100%" id="setup_'+key(e.name)+'" type="number" value="'+getWeight(e.name)+'"></div>';
   }
  }
 }
 document.getElementById("setupFields").innerHTML=html;
}

function saveSetup(){
 var seen={}, i,j,e,el;
 for(i=0;i<program.length;i++){
  for(j=0;j<program[i].exercises.length;j++){
   e=program[i].exercises[j];
   if((e.type==="5x5"||e.type==="fixed"||e.type==="range")&&!seen[e.name]){
    seen[e.name]=1; el=document.getElementById("setup_"+key(e.name));
    if(el)setWeight(e.name,parseFloat(el.value||0));
   }
  }
 }
 alert("Starting weights saved."); renderWorkout();
}

function startTimer(sec){
 stopTimer(); timerLeft=sec; updateTimer();
 timerId=setInterval(function(){timerLeft--; updateTimer(); if(timerLeft<=0){stopTimer(); alert("Rest complete");}},1000);
}
function stopTimer(){if(timerId){clearInterval(timerId);timerId=null;} if(timerLeft<0)timerLeft=0;updateTimer();}
function updateTimer(){
 var m=Math.floor(timerLeft/60),s=timerLeft%60;
 document.getElementById("timer").innerHTML=(m<10?"0":"")+m+":"+(s<10?"0":"")+s;
}
window.onload=init;
</script>
</body>
</html>
